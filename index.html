<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תמונת מצב</title>
<meta name="description" content="סקירה שוטפת ממקורות גלויים">
<link rel="manifest" href="manifest.webmanifest?v=9">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0e1116; color: #e6e9ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    line-height: 1.55; font-size: 16px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14,17,22,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #232a33;
    padding: 12px 16px;
  }
  .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0; font-weight: 700; }
  #updated { font-size: 12.5px; color: #9aa4b0; white-space: nowrap; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 48px; }
  .empty { color: #9aa4b0; padding: 32px 0; text-align: center; }
  section { margin-top: 20px; }
  h2 {
    font-size: 15px; color: #8fb6ff; margin: 0 0 8px;
    padding-bottom: 4px; border-bottom: 1px solid #232a33;
  }
  article {
    background: #161b22; border: 1px solid #232a33; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 10px;
  }
  .meta { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: #9aa4b0; margin-bottom: 4px; flex-wrap: wrap; }
  .meta time { color: #c9d1d9; }
  .badge { border: 1px solid #39424e; border-radius: 999px; padding: 0 8px; font-size: 11.5px; color: #9aa4b0; }
  h3 { font-size: 15.5px; margin: 0 0 4px; font-weight: 650; }
  p { margin: 0; font-size: 14.5px; color: #c9d1d9; white-space: pre-line; }
  a { color: #8fb6ff; text-decoration: none; overflow-wrap: anywhere; }
  .src { font-size: 12.5px; margin-top: 6px; overflow-wrap: anywhere; min-width: 0; }
  article, article p, h3 { min-width: 0; }
  article p { overflow-wrap: anywhere; }
  details.more { margin-top: 6px; overflow-wrap: anywhere; min-width: 0; }
  details.more summary { cursor: pointer; color: #8fb6ff; font-size: 13px; }
  details.more p { margin-top: 4px; overflow-wrap: anywhere; }
  #stats { font-size: 12px; color: #6b7480; }
  #mapsec { max-width: 760px; margin: 14px auto 0; padding: 0 16px; }
  #mapsec[hidden] { display: none; }
  #map { height: 340px; border-radius: 10px; border: 1px solid #232a33; background: #0b0e13; margin-top: 2px; }
  .map-note { font-size: 11.5px; color: #6b7480; margin-top: 6px; line-height: 1.5; }
  .map-note b { color: #9aa4b0; }
  .pin { width: 16px !important; height: 16px !important; margin-left: -8px !important; margin-top: -8px !important; border-radius: 50%; box-sizing: border-box; }
  .pin-approx { background: rgba(143,182,255,.25); border: 2px solid #8fb6ff; }
  .pin-exact { background: #8fb6ff; border: 2px solid #e6e9ee; }
  .leaflet-popup-content-wrapper { direction: rtl; text-align: right; background: #161b22; color: #e6e9ee; border: 1px solid #232a33; border-radius: 8px; }
  .leaflet-popup-tip { background: #161b22; }
  .leaflet-popup-content { font: 400 13.5px/1.55 system-ui, "Segoe UI", Arial, sans-serif; margin: 10px 12px; }
  .leaflet-popup-content .pop-label { color: #9aa4b0; font-size: 12.5px; margin-top: 2px; }
  .leaflet-popup-content .pop-acc { color: #8fb6ff; font-size: 12px; font-weight: 600; margin-top: 3px; }
  .leaflet-popup-content .pop-note { color: #9aa4b0; font-size: 12px; margin-top: 3px; }
  .leaflet-popup-content a { display: inline-block; margin-top: 5px; font-weight: 600; }
  .leaflet-container a.leaflet-popup-close-button { color: #9aa4b0; }
  .leaflet-bar a { background: #161b22; color: #e6e9ee; border-bottom: 1px solid #232a33; }
  .leaflet-tile-pane { filter: brightness(.6) invert(1) contrast(3) hue-rotate(200deg) saturate(.3) brightness(.7); }
  .leaflet-control-attribution { background: rgba(11,14,19,.75) !important; color: #555f6b !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: #7d8ea3 !important; }
  @media (max-width: 360px) { #map { height: 260px; } }
  footer { max-width: 760px; margin: 24px auto 0; padding: 0 16px 24px; color: #6b7480; font-size: 12px; }

  .tools { max-width:760px; margin:auto; padding:0 16px; }
  .tools p, .map-note {color:#aab4c2; font-size:13px;}
  #changes {background:#161b22;border:1px solid #39424e;border-radius:10px;padding:12px;margin:14px 0 10px;}
  #changes h2 {border:0;margin:0 0 6px;} #changes ul {padding-right:20px;margin:6px 0;}
  #filters {display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  button, .action, details.more summary {min-height:44px;}
  button, .action {font:inherit;font-size:14px;border-radius:8px;border:1px solid #526176;background:#161b22;color:#d3def0;padding:9px 12px;cursor:pointer;}
  #filters button[aria-pressed=true] {background:#263e61;color:#fff;border-color:#8fb6ff;}
  :focus-visible {outline:3px solid #8fb6ff;outline-offset:3px;}
  article, #mapsec, #map-detail, #content {scroll-margin-top:120px;}
  article:target {border-color:#8fb6ff;} .card-action {display:inline-flex;align-items:center;margin-top:8px;}
  details.more summary {display:flex;align-items:center;} details.more summary::before{content:'◂';margin-left:8px;} details.more[open] summary::before{content:'▾';}
  .pin {width:44px!important;height:44px!important;margin-left:-22px!important;margin-top:-22px!important;border:0;background:transparent;display:flex;align-items:center;justify-content:center;}
  .pin span {display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:2px solid #abcaff;border-radius:50%;background:#172538;color:#fff;font-size:12px;font-weight:700;box-shadow:0 0 0 2px #0e1116;}
  .pin .cluster {width:30px;height:30px;} .pin .exact {background:#8fb6ff;color:#101722;}
  #map-detail {background:#161b22;border:1px solid #8fb6ff;border-radius:10px;padding:12px;margin-top:10px;}
  #map-detail h3{font-size:15px;} #map-detail article {padding:10px;margin-top:8px;} #map-detail p{font-size:13px;}
  .map-links {display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .map-links a {min-height:44px;display:flex;align-items:center;}
  .leaflet-control-zoom a {width:44px!important;height:44px!important;line-height:44px!important;}
  #map {isolation:isolate;z-index:0;} .empty{padding:20px 0;}
  @media(max-width:360px){#map{height:340px;}.head-row{gap:6px;}#updated{font-size:11px;}}
.admin-entry{min-height:44px;display:inline-flex;align-items:center;padding:6px 10px;color:inherit;border:1px solid #64748b;border-radius:8px;font-size:13px;white-space:nowrap;text-decoration:none;}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>תמונת מצב</h1>
    <span id="updated">טוען…</span>
  </div>
  <div class="head-row"><span id="stats"></span><a class="admin-entry" href="https://situation-admin.menachemlasker.workers.dev/" rel="noopener">כניסת מנהל 🔒</a></div>
</header>
<div id="overview" class="tools"><section id="changes" aria-live="polite"></section><nav id="filters" aria-label="סינון אזורי"></nav><p id="result-count" aria-live="polite"></p></div>
<section id="mapsec" hidden>
  <h2>מפה</h2>
  <div id="map" aria-label="מיקומים משוערים"></div><div id="map-detail" hidden></div>
  <div class="map-note">הסימונים מראים מרכזי יישובים <b>משוערים</b> להתמצאות בלבד - לא נקודות אירוע מדויקות. לחיצה על סמן מציגה פרטים ואזהרות.</div>
</section>
<main id="content">
  <div class="empty">טוען נתונים…</div>
</main>
<footer>כל המידע ממקורות גלויים בלבד ועלול להיות חלקי.</footer>
<script src="vendor/leaflet.js"></script>
<script src="app.js?v=10"></script>
</body>
</html>
