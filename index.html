<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תמונת מצב</title>
<meta name="description" content="סקירה שוטפת ממקורות גלויים">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0e1116; color: #e6e9ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    line-height: 1.55; font-size: 16px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14,17,22,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #232a33;
    padding: 12px 16px;
  }
  .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0; font-weight: 700; }
  #updated { font-size: 12.5px; color: #9aa4b0; white-space: nowrap; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 48px; }
  .empty { color: #9aa4b0; padding: 32px 0; text-align: center; }
  section { margin-top: 20px; }
  h2 {
    font-size: 15px; color: #8fb6ff; margin: 0 0 8px;
    padding-bottom: 4px; border-bottom: 1px solid #232a33;
  }
  article {
    background: #161b22; border: 1px solid #232a33; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 10px;
  }
  .meta { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: #9aa4b0; margin-bottom: 4px; flex-wrap: wrap; }
  .meta time { color: #c9d1d9; }
  .badge { border: 1px solid #39424e; border-radius: 999px; padding: 0 8px; font-size: 11.5px; color: #9aa4b0; }
  h3 { font-size: 15.5px; margin: 0 0 4px; font-weight: 650; }
  p { margin: 0; font-size: 14.5px; color: #c9d1d9; white-space: pre-line; }
  a { color: #8fb6ff; text-decoration: none; overflow-wrap: anywhere; }
  .src { font-size: 12.5px; margin-top: 6px; overflow-wrap: anywhere; min-width: 0; }
  article, article p, h3 { min-width: 0; }
  article p { overflow-wrap: anywhere; }
  details.more { margin-top: 6px; overflow-wrap: anywhere; min-width: 0; }
  details.more summary { cursor: pointer; color: #8fb6ff; font-size: 13px; }
  details.more p { margin-top: 4px; overflow-wrap: anywhere; }
  footer { max-width: 760px; margin: 24px auto 0; padding: 0 16px 24px; color: #6b7480; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>תמונת מצב</h1>
    <span id="updated">טוען…</span>
  </div>
</header>
<main id="content">
  <div class="empty">טוען נתונים…</div>
</main>
<footer>כל המידע ממקורות גלויים בלבד ועלול להיות חלקי.</footer>
<script src="app.js"></script>
</body>
</html>
